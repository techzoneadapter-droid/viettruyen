name: Build and release Windows
on:
  push:
    branches: [main]
    paths-ignore: ['mumu-upstream/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Assign a unique release version
        shell: pwsh
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version.Split(".")
          npm version "$($base[0]).$($base[1]).${{ github.run_number }}" --no-git-tag-version
      - name: Create release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          git tag "v$version"
          git push origin "v$version"
      - name: Publish installer and updater metadata
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VietTruyen-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
